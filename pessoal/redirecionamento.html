<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VigiRAM</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #115e59; /* teal-800 */
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #f0fdfa;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: #f0fdfa;
      animation: girar 0.8s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    p {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.01em;
    }
    a { color: inherit; }
  </style>
</head>
<body>
  <div class="spinner" aria-hidden="true"></div>
  <p>Entrando no VigiRAM…</p>
  <noscript><a href="<?= novaUrl ?>">Entrar no VigiRAM</a></noscript>

  <script>
    (function () {
      var novaUrl = <?!= JSON.stringify(novaUrl) ?>;
      if (!novaUrl) return;
      try {
        window.top.location.replace(novaUrl);
      } catch (e) {
        window.top.location.href = novaUrl;
      }
    })();
  </script>
</body>
</html>
