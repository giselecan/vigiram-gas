<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VigiRAM</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #115e59; /* teal-800 */
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    /* Navegadores bloqueiam redirecionamento automático de dentro do
       iframe sandbox do Apps Script sem um clique real do usuário
       (SecurityError: "no user activation"). O JS abaixo tenta o
       automático primeiro; o botão abaixo é o caminho garantido — um
       clique real sempre é permitido. */
    .btn {
      display: inline-block;
      background: #0d9488; /* teal-600 */
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 32px;
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <a class="btn" id="link" href="<?= novaUrl ?>" target="_top" rel="noopener">Entrar</a>

  <script>
    (function () {
      var novaUrl = <?!= JSON.stringify(novaUrl) ?>;
      if (!novaUrl) return;
      try {
        window.top.location.replace(novaUrl);
      } catch (e) {
        // Bloqueado pelo navegador (sem gesto do usuário) — o botão
        // acima (id="link") continua funcionando a um clique.
      }
    })();
  </script>
</body>
</html>
